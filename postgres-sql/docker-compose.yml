services:
  # Configure DB service with postgress
  postgresdb:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: postgres:17.2
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgresdb/data:/data/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
  # Configure admin interface for postgres DB  
  pgadmin:
    container_name: ${PGADMIN_CONTAINER_NAME}
    image: dpage/pgadmin4
    restart: always
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgresdb
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
